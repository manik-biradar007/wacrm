name: Flows + automations cron

# Pings the two internal cron endpoints on a schedule. Neither has any
# other scheduler behind it (no Vercel Cron configured, no external
# pinger) — without this, flow `wait` nodes never resume and abandoned
# runs/automations never get swept, regardless of how correct the
# app-side logic is.
#
# GitHub's schedule trigger is best-effort — actual firing can lag a
# few minutes behind the cron expression, especially on the free tier.
# `*/5` is a floor, not a guarantee. Tighten if wait-node precision
# needs to be closer to exact.
#
# Requires a repository secret named AUTOMATION_CRON_SECRET matching
# the same-named env var on Vercel (Settings → Secrets and variables →
# Actions → New repository secret).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Resume due flow waits + sweep timed-out runs
        run: |
          curl -sf -H "x-cron-secret: ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            https://wacrm-biodata.vercel.app/api/flows/cron

      - name: Sweep due automation executions
        run: |
          curl -sf -H "x-cron-secret: ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            https://wacrm-biodata.vercel.app/api/automations/cron
